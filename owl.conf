buffer_period_ms: 10000
database_trim: true
sensors:
   - name: cpu-load
     type: ratio
     interval_ms: 100
     method: sys
     device: cpu-usage
   - name: mem-load
     type: ratio
     interval_ms: 100
     method: sys
     device: mem-usage
   - name: runtime
     type: counter
     interval_ms: 10000
     method: sys
     device: uptime
   - name: cpu-temp
     type: temperature
     interval_ms: 1000
     method: iio
     device: coretemp
     channel: temp3
     attribute: input
 